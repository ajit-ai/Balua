[package]
name = "baluac"
version.workspace = true
edition.workspace = true
description = "Balua compiler — frontend, MIR, and heterogeneous backends (balua.exe driver)"

[[bin]]
name = "balua"
path = "src/main.rs"

[[bin]]
name = "baluac"
path = "src/main.rs"

[lib]
name = "baluac_lib"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
cranelift-codegen.workspace = true
cranelift-frontend.workspace = true
cranelift-module.workspace = true
cranelift-object.workspace = true
target-lexicon.workspace = true
llvm-sys = { workspace = true, optional = true }

[features]
llvm = ["dep:llvm-sys"]
default = []

[dev-dependencies]
serde_json = "1.0"
