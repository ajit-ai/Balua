[package]
name = "baluac"
version.workspace = true
edition.workspace = true
description = "Balua compiler — frontend, MIR, and heterogeneous backends (balua.exe driver)"

[[bin]]
name = "balua"
path = "src/main.rs"

[[bin]]
name = "baluac"
path = "src/main.rs"

[lib]
name = "baluac_lib"
path = "src/lib.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true

[features]
llvm = []
default = []

[dev-dependencies]
serde_json = "1.0"
