name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test -p baluac --test lexer_tests --test parser_tests --test semantic_tests --test safety_tests --test cli_tests --test fuzz_smoke
      - run: cargo test -p blpkg
      - run: cargo test -p baluac --lib
      - run: cargo test -p balua-fmt -p balua-test
      - run: cargo test -p baluac --test execution
      - run: cargo run -q -p baluac --bin balua -- examples/01_hello_hardware.bl --emit-mir
      - run: cargo run -q -p baluac --bin balua -- hello.bl -o hello-ci.exe
  fmt:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p balua-fmt -- --check hello.bl keyword_test.bl examples tests tests/hal selfhost std std/hal std/ffi
  test-runner:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p balua-test -- tests/pass.bl
      - run: cargo run -q -p balua-test -- --bench=2 tests/pass.bl
  llvm:
    # Real LLVM verification (E1 exit proof). Upstream Windows installers
    # lack llvm-config, so this job uses MSYS2/MinGW64 LLVM (dev package,
    # compiler-matched with the GNU Rust toolchain per llvm-sys docs).
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-llvm mingw-w64-x86_64-gcc
      - run: |
          echo "LLVM_SYS_221_PREFIX=$(llvm-config --prefix)" >> $GITHUB_ENV
          echo "PATH=$(cygpath -u "$CARGO_HOME")/bin:$PATH" >> $GITHUB_ENV
          llvm-config --version
      - run: cargo build -p baluac --features llvm
      - run: cargo test -p baluac --features llvm --lib
      - run: cargo test -p baluac --features llvm --test execution
        env:
          BALUA_CPU_BACKEND: llvm
      - run: cargo run -q -p baluac --features llvm --bin balua -- hello.bl --emit-llvm
      - run: cargo run -q -p baluac --features llvm --bin balua -- hello.bl -o hello-llvm.exe
  blpkg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p blpkg
      - run: cargo run -q -p blpkg --bin blpkg -- --help
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: sphinx-build -b html -W docs docs/_build/html
