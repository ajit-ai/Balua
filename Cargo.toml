[workspace]
members = ["crates/baluac", "crates/blpkg", "tools/balua-fmt", "tools/balua-test"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Balua Language Authority <balua@balua-lang.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ajit-ai/Balua"
keywords = ["compiler", "systems", "heterogeneous", "gpu", "fpga"]
categories = ["compilers", "embedded", "science"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

cranelift-codegen = "0.110"
cranelift-frontend = "0.110"
cranelift-module = "0.110"
cranelift-object = "0.110"
target-lexicon = "0.12"
